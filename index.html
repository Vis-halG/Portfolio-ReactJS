<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vishal S. Gupta — Front-End Developer</title>
    <meta
      name="description"
      content="Portfolio of Vishal S. Gupta, a front-end developer building fast, responsive websites and web apps with React, Tailwind and modern JavaScript."
    />
    <meta name="theme-color" content="#ff5f49" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />

    <!-- Warm up the image CDN before the parser reaches the hero <img>. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!--
      The hero is the LCP element. Preloading it with the same srcset/sizes the
      <img> uses lets the browser start the download during HTML parse, instead
      of waiting for React to mount and render the tag.
    -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      imagesrcset="
        https://res.cloudinary.com/dwtn2kajc/image/upload/f_auto,q_auto,w_600/v1739437437/Main-OG_rfy4zm.png   600w,
        https://res.cloudinary.com/dwtn2kajc/image/upload/f_auto,q_auto,w_900/v1739437437/Main-OG_rfy4zm.png   900w,
        https://res.cloudinary.com/dwtn2kajc/image/upload/f_auto,q_auto,w_1200/v1739437437/Main-OG_rfy4zm.png 1200w"
      imagesizes="(min-width: 768px) 592px, 100vw"
    />

    <!-- Full-bleed page background, referenced from App.css. -->
    <link rel="preload" as="image" href="/backgroundd.webp" type="image/webp" />

    <!--
      Splash-screen styles are inlined so the first paint needs zero round
      trips: the loader is visible before the bundle or stylesheet arrives.
    -->
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        /* Average colour of backgroundd.webp, so the reveal after the splash
           fades does not flash white while that image decodes. */
        background-color: #e2e2e3;
      }
      /*
       * Deliberately identical to .loading in LoadingScreen.css: this splash
       * is swapped for the React one the moment the bundle runs, and any
       * mismatch would read as a flash.
       */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 1.8rem;
        font-weight: bold;
        letter-spacing: 10px;
        text-indent: 10px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Replaced by the React loader the moment the bundle executes. -->
    <div id="boot">LOADING</div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
